<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{YEAR}}年{{MONTH}}月 — {{SITE_TITLE}}</title>
<link rel="stylesheet" href="{{ASSETS_PREFIX}}/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="{{ASSETS_PREFIX}}/../index.html" class="site-logo">{{SITE_TITLE}}</a>
    <span class="header-count">{{YEAR}}年{{MONTH}}月 &middot; {{MONTH_COUNT}}枚</span>
    <div class="header-actions">
      <button id="btn-search" class="icon-btn" title="検索/フィルター" aria-label="検索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="テーマ切替" aria-label="テーマ切替">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Search / Filter drawer -->
<div id="search-drawer" class="drawer hidden">
  <div class="drawer-overlay"></div>
  <div class="drawer-panel">
    <div class="drawer-header">
      <h2>検索 / フィルター</h2>
      <button id="btn-close-search" class="icon-btn" aria-label="閉じる">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <input type="text" id="search-input" class="search-field" placeholder="ファイル名 / カメラ / レンズ で検索…">
      <div id="filter-chips" class="filter-chips"></div>
      <div id="active-filters" class="active-filters"></div>
    </div>
  </div>
</div>

<!-- Year/Month navigation -->
<nav class="year-nav">
  {{NAV_ITEMS}}
</nav>

<main class="main-content">
  {{DAY_SECTIONS}}
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden">
  <div class="lb-overlay"></div>
  <button class="lb-close icon-btn" aria-label="閉じる">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lb-prev icon-btn" aria-label="前へ">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="lb-next icon-btn" aria-label="次へ">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
  </button>
  <div class="lb-content">
    <img class="lb-img" src="" alt="">
  </div>
  <div class="lb-info">
    <span class="lb-date"></span>
    <span class="lb-camera"></span>
    <span class="lb-settings"></span>
  </div>
</div>

<footer class="site-footer">
  <p>Generated by Photo Archive</p>
</footer>

<script src="{{ASSETS_PREFIX}}/app.js"></script>
</body>
</html>
